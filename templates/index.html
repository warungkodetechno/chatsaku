<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>ChatSaku Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        :root {

            --green: #25D366;
            --green2: #1db954;
            --green3: #15803d;
            --white: #ffffff;
            --text: #143126;

        }

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Nunito', sans-serif;

        }

        body {

            background: #edf7f0;

        }

        .layout {

            display: flex;

            min-height: 100vh;

        }

        .sidebar {

            width: 255px;

            background: linear-gradient(180deg, #25D366, #20bf60, #169b4c);

            padding: 22px;

            display: flex;

            flex-direction: column;

            color: white;

            box-shadow: 0 18px 45px rgba(0, 0, 0, .12);

        }

        .sidebar-logo {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 35px;

        }

        .logo-icon {

            width: 58px;

            height: 58px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: rgba(255, 255, 255, .18);

            backdrop-filter: blur(10px);

            font-size: 28px;

        }

        .sidebar-logo h4 {

            margin: 0;

            font-family: 'Baloo 2';

            font-size: 24px;

        }

        .sidebar-logo span {

            font-size: 12px;

            opacity: .9;

        }

        .menu-title {

            margin: 18px 0 10px;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 700;

            opacity: .75;

        }

        .sidebar-menu {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }

        .sidebar-menu a {

            height: 50px;

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 0 14px;

            border-radius: 16px;

            text-decoration: none;

            color: white;

            transition: .25s;

            font-weight: 600;

            cursor: pointer;

        }

        .sidebar-menu a:hover {

            background: rgba(255, 255, 255, .12);

            transform: translateX(4px);

        }

        .sidebar-menu a.active {

            background: white;

            color: #17994d;

            box-shadow: 0 12px 25px rgba(0, 0, 0, .10);

        }

        .icon {

            width: 36px;

            height: 36px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: rgba(255, 255, 255, .18);

            transition: .25s;

        }

        .active .icon {

            background: #e9fff0;

        }

        .sidebar-footer {

            margin-top: auto;

        }

        .status-card {

            background: rgba(255, 255, 255, .14);

            padding: 16px;

            border-radius: 20px;

            display: flex;

            align-items: center;

            gap: 12px;

            backdrop-filter: blur(12px);

        }

        .status-dot {

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #8fff9d;

            box-shadow: 0 0 12px #8fff9d;

        }

        .status-card strong {

            display: block;

            font-size: 14px;

        }

        .status-card small {

            opacity: .9;

        }

        .content {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .coming {

            font-size: 40px;

            font-weight: 700;

            color: #15803d;

            font-family: 'Baloo 2';

        }
    </style>

</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <!-- LOGO -->

            <div class="sidebar-logo">

                <div class="logo-icon">

                    <i class="bi bi-whatsapp"></i>

                </div>

                <div>

                    <h4>ChatSaku</h4>

                    <span>Smart Finance</span>

                </div>

            </div>

            <!-- MAIN -->

            <div class="menu-title">

                MAIN

            </div>

            <nav class="sidebar-menu">

                <a class="active">

                    <div class="icon">

                        <i class="bi bi-house"></i>

                    </div>

                    Dashboard

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-wallet2"></i>

                    </div>

                    Saldo

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-graph-up"></i>

                    </div>

                    Cashflow

                </a>

            </nav>

            <div class="menu-title">

                KEUANGAN

            </div>

            <nav class="sidebar-menu">

                <a>

                    <div class="icon">

                        <i class="bi bi-bullseye"></i>

                    </div>

                    Target

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-pie-chart"></i>

                    </div>

                    Budget

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-bell"></i>

                    </div>

                    Reminder

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-person-dash"></i>

                    </div>

                    Hutang

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-person-check"></i>

                    </div>

                    Piutang

                </a>

            </nav>

            <div class="menu-title">

                AI

            </div>

            <nav class="sidebar-menu">

                <a>

                    <div class="icon">

                        <i class="bi bi-stars"></i>

                    </div>

                    AI Insight

                </a>

                <a>

                    <div class="icon">

                        <i class="bi bi-clock-history"></i>

                    </div>

                    Riwayat

                </a>

            </nav>

            <div class="sidebar-footer">

                <div class="status-card">

                    <div class="status-dot"></div>

                    <div>

                        <strong>WhatsApp Connected</strong>

                        <small>Premium Plan</small>

                    </div>

                </div>

            </div>

        </aside>

        <main class="content">

            <header class="topbar">

                <div class="left-side">

                    <button class="menu-btn">

                        <i class="bi bi-list"></i>

                    </button>

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input type="text" placeholder="Cari transaksi, budget, AI Insight...">

                    </div>

                </div>

                <div class="right-side">

                    <button class="icon-btn">

                        <i class="bi bi-bell"></i>

                        <span class="badge-dot"></span>

                    </button>

                    <button class="icon-btn">

                        <i class="bi bi-moon-stars"></i>

                    </button>

                    <div class="profile-card">

                        <img src="https://ui-avatars.com/api/?name=ChatSaku&background=25D366&color=fff">

                        <div>

                            <strong>ChatSaku</strong>

                            <small>Premium User</small>

                        </div>

                    </div>

                </div>

            </header>

            <section class="dashboard-body">

                <div class="coming">

                    Dashboard Coming Soon

                </div>

            </section>

        </main>
        <style>
            .content {

                flex: 1;

                display: flex;

                flex-direction: column;

                background: #f7faf8;

            }

            .topbar {

                height: 78px;

                background: white;

                display: flex;

                justify-content: space-between;

                align-items: center;

                padding: 0 30px;

                border-bottom: 1px solid #edf2f7;

                position: sticky;

                top: 0;

                z-index: 99;

            }

            .left-side {

                display: flex;

                align-items: center;

                gap: 18px;

            }

            .menu-btn {

                width: 44px;

                height: 44px;

                border: none;

                border-radius: 14px;

                background: #eefbf2;

                color: #17994d;

                font-size: 20px;

                transition: .25s;

            }

            .menu-btn:hover {

                transform: rotate(90deg);

            }

            .search-box {

                width: 420px;

                height: 46px;

                background: #f7faf8;

                border-radius: 16px;

                display: flex;

                align-items: center;

                padding: 0 18px;

                gap: 12px;

                border: 1px solid #e5ece7;

            }

            .search-box input {

                flex: 1;

                border: none;

                background: transparent;

                outline: none;

            }

            .search-box i {

                color: #94a3b8;

            }

            .right-side {

                display: flex;

                align-items: center;

                gap: 16px;

            }

            .icon-btn {

                width: 46px;

                height: 46px;

                border: none;

                background: white;

                border-radius: 16px;

                box-shadow: 0 8px 20px rgba(0, 0, 0, .05);

                position: relative;

                transition: .25s;

            }

            .icon-btn:hover {

                transform: translateY(-3px);

            }

            .badge-dot {

                width: 8px;

                height: 8px;

                border-radius: 50%;

                background: #ef4444;

                position: absolute;

                right: 12px;

                top: 12px;

            }

            .profile-card {

                display: flex;

                align-items: center;

                gap: 12px;

                background: white;

                border-radius: 18px;

                padding: 8px 16px;

                box-shadow: 0 8px 24px rgba(0, 0, 0, .05);

            }

            .profile-card img {

                width: 46px;

                height: 46px;

                border-radius: 50%;

            }

            .profile-card strong {

                display: block;

                color: #143126;

            }

            .profile-card small {

                color: #6b7280;

            }

            .dashboard-body {

                flex: 1;

                display: flex;

                justify-content: center;

                align-items: center;

                padding: 40px;

            }
        </style>

    </div>

</body>

</html>
