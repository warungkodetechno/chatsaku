```html
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ChatSaku</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(135deg, #E8FFF1, #F7FFF9);

            overflow-x: hidden;

            position: relative;

        }

        body::before {

            content: "";

            position: absolute;

            width: 350px;

            height: 350px;

            background: #25D36622;

            border-radius: 50%;

            top: -120px;

            right: -120px;

        }

        body::after {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            background: #25D36618;

            border-radius: 50%;

            bottom: -120px;

            left: -120px;

        }

        .login-card {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 420px;

            background: white;

            border-radius: 24px;

            padding: 35px;

            box-shadow: 0 25px 60px rgba(0, 0, 0, .08);

        }

        .logo {

            width: 80px;

            display: block;

            margin: auto;

            margin-bottom: 18px;

        }

        h3 {

            font-size: 24px;

            font-weight: 700;

            text-align: center;

            color: #1d3b2f;

        }

        .subtitle {

            text-align: center;

            color: #6f7e78;

            font-size: 13px;

            margin-bottom: 30px;

        }

        .form-label {

            font-size: 13px;

            font-weight: 600;

            color: #4d5d57;

        }

        .input-group {

            margin-bottom: 18px;

        }

        .input-group-text {

            border-radius: 14px 0 0 14px;

            background: #F2FFF6;

            border-color: #d8efe1;

        }

        .form-control {

            border-radius: 0 14px 14px 0;

            height: 50px;

            border-color: #d8efe1;

        }

        .form-control:focus {

            box-shadow: none;

            border-color: #25D366;

        }

        .btn-login {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 14px;

            background: #25D366;

            color: white;

            font-weight: 600;

            transition: .25s;

        }

        .btn-login:hover {

            background: #1cb85b;

        }

        .footer {

            margin-top: 20px;

            text-align: center;

            font-size: 13px;

        }

        .footer a {

            color: #25D366;

            text-decoration: none;

            font-weight: 600;

        }

        .alert {

            display: none;

        }

        .spinner-border {

            width: 18px;

            height: 18px;

            display: none;

        }

        @media(max-width:576px) {

            .login-card {

                margin: 20px;

                padding: 28px;

            }

        }
    </style>

</head>

<body>

    <div class="login-card">

        <img src="assets/logo.png" class="logo">

        <h3>Selamat Datang 👋</h3>

        <div class="subtitle">

            Login untuk mengakses Dashboard ChatSaku

        </div>

        <div class="alert alert-danger" id="errorBox"></div>

        <div class="mb-3">

            <label class="form-label">

                Email

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-envelope"></i>

                </span>

                <input id="email" type="email" class="form-control" placeholder="email@gmail.com">

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Password

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock"></i>

                </span>

                <input id="password" type="password" class="form-control" placeholder="********">

            </div>

        </div>

        <button class="btn-login" onclick="login()">

            <span class="spinner-border spinner-border-sm" id="loading"></span>

            Masuk

        </button>

        <div class="footer">

            Belum punya akun?

            <a href="register.html">

                Daftar Sekarang

            </a>

        </div>

    </div>

    <script>

        const API_URL = "https://web-production-c01b5.up.railway.app/login";
        // Ganti dengan URL Railway Anda

        async function login() {

            const email = document.getElementById("email").value.trim();

            const password = document.getElementById("password").value;

            const errorBox = document.getElementById("errorBox");

            const loading = document.getElementById("loading");

            errorBox.style.display = "none";

            loading.style.display = "inline-block";

            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        email,

                        password

                    })

                });

                const result = await response.json();

                loading.style.display = "none";

                if (result.success) {

                    localStorage.setItem("token", result.token);

                    localStorage.setItem("user", JSON.stringify(result.user));

                    window.location.href = "index.html";

                } else {

                    errorBox.style.display = "block";

                    errorBox.innerHTML = result.message;

                }

            } catch (err) {

                loading.style.display = "none";

                errorBox.style.display = "block";

                errorBox.innerHTML = "Tidak dapat terhubung ke server.";

            }

        }

        document.getElementById("password").addEventListener("keypress", function (e) {

            if (e.key === "Enter") {

                login();

            }

        });

    </script>

</body>

</html>
