```html
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - ChatSaku</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(135deg, #E8FFF1, #F7FFF9);

            position: relative;

            overflow-x: hidden;

        }

        body::before {

            content: "";

            position: absolute;

            width: 350px;

            height: 350px;

            background: #25D36620;

            border-radius: 50%;

            top: -120px;

            right: -120px;

        }

        body::after {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            background: #25D36615;

            border-radius: 50%;

            bottom: -120px;

            left: -120px;

        }

        .register-card {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 450px;

            background: white;

            border-radius: 24px;

            padding: 35px;

            box-shadow: 0 25px 60px rgba(0, 0, 0, .08);

        }

        .logo {

            width: 80px;

            display: block;

            margin: auto;

            margin-bottom: 18px;

        }

        h3 {

            text-align: center;

            font-size: 24px;

            font-weight: 700;

            color: #214132;

        }

        .subtitle {

            text-align: center;

            font-size: 13px;

            color: #6d7d76;

            margin-bottom: 28px;

        }

        .form-label {

            font-size: 13px;

            font-weight: 600;

        }

        .input-group {

            margin-bottom: 16px;

        }

        .input-group-text {

            border-radius: 14px 0 0 14px;

            background: #F3FFF7;

            border-color: #dcefe2;

        }

        .form-control {

            border-radius: 0 14px 14px 0;

            height: 50px;

            border-color: #dcefe2;

        }

        .form-control:focus {

            border-color: #25D366;

            box-shadow: none;

        }

        .btn-register {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 14px;

            background: #25D366;

            color: white;

            font-weight: 600;

            transition: .25s;

        }

        .btn-register:hover {

            background: #1DB954;

        }

        .alert {

            display: none;

        }

        .footer {

            text-align: center;

            margin-top: 20px;

            font-size: 13px;

        }

        .footer a {

            text-decoration: none;

            color: #25D366;

            font-weight: 600;

        }

        .spinner-border {

            width: 18px;

            height: 18px;

            display: none;

        }

        @media(max-width:576px) {

            .register-card {

                margin: 20px;

                padding: 25px;

            }

        }
    </style>

</head>

<body>

    <div class="register-card">

        <img src="assets/logo.png" class="logo">

        <h3>Buat Akun Baru ✨</h3>

        <div class="subtitle">

            Kelola keuanganmu lebih mudah bersama ChatSaku

        </div>

        <div id="successBox" class="alert alert-success"></div>

        <div id="errorBox" class="alert alert-danger"></div>

        <label class="form-label">Nama Lengkap</label>

        <div class="input-group">

            <span class="input-group-text">

                <i class="bi bi-person"></i>

            </span>

            <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap">

        </div>

        <label class="form-label">Email</label>

        <div class="input-group">

            <span class="input-group-text">

                <i class="bi bi-envelope"></i>

            </span>

            <input type="email" id="email" class="form-control" placeholder="email@gmail.com">

        </div>

        <label class="form-label">Nomor WhatsApp</label>

        <div class="input-group">

            <span class="input-group-text">

                <i class="bi bi-whatsapp"></i>

            </span>

            <input type="text" id="nomor" class="form-control" placeholder="08xxxxxxxxxx">

        </div>

        <label class="form-label">Password</label>

        <div class="input-group">

            <span class="input-group-text">

                <i class="bi bi-lock"></i>

            </span>

            <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter">

        </div>

        <button class="btn-register" onclick="register()">

            <span class="spinner-border spinner-border-sm" id="loading"></span>

            Daftar Sekarang

        </button>

        <div class="footer">

            Sudah punya akun?

            <a href="login.html">

                Login

            </a>

        </div>

    </div>

    <script>

        const API_URL = "https://web-production-c01b5.up.railway.app/register";
        // Ganti dengan URL backend Railway Anda

        async function register() {

            const nama = document.getElementById("nama").value.trim();

            const email = document.getElementById("email").value.trim();

            const nomor = document.getElementById("nomor").value.trim();

            const password = document.getElementById("password").value;

            const loading = document.getElementById("loading");

            const error = document.getElementById("errorBox");

            const success = document.getElementById("successBox");

            error.style.display = "none";

            success.style.display = "none";

            loading.style.display = "inline-block";

            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        nama: nama,

                        email: email,

                        nomor_whatsapp: nomor,

                        password: password

                    })

                });

                const result = await response.json();

                loading.style.display = "none";

                if (result.success) {

                    success.style.display = "block";

                    success.innerHTML = "✅ Registrasi berhasil. Mengalihkan ke halaman login...";

                    setTimeout(function () {

                        window.location = "login.html";

                    }, 2000);

                } else {

                    error.style.display = "block";

                    error.innerHTML = result.message;

                }

            } catch (e) {

                loading.style.display = "none";

                error.style.display = "block";

                error.innerHTML = "Tidak dapat terhubung ke server.";

            }

        }

        document.getElementById("password").addEventListener("keypress", function (e) {

            if (e.key === "Enter") {

                register();

            }

        });

    </script>

</body>

</html>
